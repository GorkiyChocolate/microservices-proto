name: "Generate Protobuf Stubs"

on:
  push:
    tags:
      - 'v*' # Триггер срабатывает на пуш тегов вида v0.1.0, v1.2.3

# Обязательно даем токену права на запись, иначе git push упадет с 403 ошибкой
permissions:
  contents: write

jobs:
  protoc:
    name: "Generate for ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Добавляй сюда новые сервисы по мере их появления
        service: ["order"] 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Нужно, чтобы видеть всю историю веток и тегов

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Extract Release Version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Run generation script
        shell: bash
        run: |
          chmod +x ./run.sh
          ./run.sh ${{ matrix.service }} ${{ env.RELEASE_VERSION }}